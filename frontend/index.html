<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="React application that pulls data from Liquipedia to provide statistics overview of the BSL ProLeague series." />
    <link rel="icon" type="image/png" href="/bsl-stats-icon.png" />
    <!--
      App icon support including Android/iOS
    -->

    <link rel="apple-touch-icon" sizes="152x152" href="/bsl-stats-icon.png" />

    <title>BSL ProLeague Statistics</title>
    <!-- Include bootstrap css via cdn -->

      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <!-- Include Font Awesome Kit for icons support via cdn -->
    <script

      crossorigin="anonymous"></script>

            function () {
              (c[a].q = c[a].q || []).push(arguments);

          t.async = 1;

          y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', 'pdcyezgm1b');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Include bootstrap js via cdn -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"

    <script type="module" src="/src/main.tsx"></script>

</html>
